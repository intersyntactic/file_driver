name: is_file_driver
description: >-
  intersyntactic's file driver: reads and writes the files the airlock has
  decided, as the suit a trajectory's agent wears, in that suit's home.
version: 0.6.2
repository: https://github.com/intersyntactic/file_driver
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  is_file_request_vocabulary: ^0.1.0
  is_outcome_vocabulary: ^0.1.0
  is_path_confinement: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  is_unix_socket_user_check: ^0.2.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
